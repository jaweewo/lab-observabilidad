global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Métricas OTel (HTTP server/client, JVM runtime) exportadas por el collector
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  # Métricas JMX de cada JVM (jmx_prometheus_javaagent en :9404)
  - job_name: jmx
    static_configs:
      - targets: ["app-sandra:9404"]
        labels: {service: app-sandra}
      - targets: ["app-evacsv:9404"]
        labels: {service: app-evacsv}
      - targets: ["app-report:9404"]
        labels: {service: app-report}
      - targets: ["app-inside:9404"]
        labels: {service: app-inside}
